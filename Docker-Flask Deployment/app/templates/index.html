<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CIFAR-10 Image Classifier </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>CIFAR-10 Image Classifier — Hyperparameter-Tuned Model</h1>
    <form method="POST" action="/predict" enctype="multipart/form-data">
        <div class="upload-preview-row">
            <div class="file-upload">
                <button class="file-button" type="button" id="choose-file">Choose File</button>
                <span class="file-name" id="file-name">{{ file_name or 'No file chosen' }}</span>
                <input type="file" id="image-file" name="file" accept="image/*" required>
            </div>
            <img
                class="image-preview"
                id="image-preview"
                src="{{ image_url or '' }}"
                alt="Selected image preview"
                {% if image_url %}style="display: block;"{% endif %}
            >
        </div>
        <button class="predict-button" type="submit">Predict</button>
    </form>
    {% if prediction %}
        <h2>Prediction: <span class="prediction-value">{{ prediction|capitalize }}</span></h2>
    {% endif %}
    <script>
        const fileInput = document.getElementById("image-file");
        const fileName = document.getElementById("file-name");
        const chooseFile = document.getElementById("choose-file");

        chooseFile.addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            const preview = document.getElementById("image-preview");

            fileName.textContent = file ? file.name : "No file chosen";

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            } else {
                preview.removeAttribute("src");
                preview.style.display = "none";
            }
        });
    </script>
</body>
</html>
